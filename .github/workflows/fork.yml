name: Fork

on:
  push:
    branches: [main]
    tags: ['oliviacpu-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'oliviacpu/wizarr'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: uv sync --frozen --group dev
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/static/package-lock.json
      - run: npm --prefix app/static ci
      - run: npm --prefix app/static run build
      - run: uv run --frozen --group dev ruff check app tests migrations
      - run: uv run --frozen --group dev ruff format --check app tests migrations
      - run: uv run --frozen --group dev djlint app/templates --check --profile=jinja
      # Upstream's broad ty check is advisory. Gate the new service and routes.
      - run: uv run --frozen --group dev ty check app/services/access_requests.py app/blueprints/access_requests/routes.py app/blueprints/auth/redirects.py
      - run: uv run --frozen --group dev playwright install --with-deps chromium
      - run: uv run --frozen --group dev pytest --verbose --browser chromium

  image:
    needs: check
    if: github.repository == 'oliviacpu/wizarr' && startsWith(github.ref, 'refs/tags/oliviacpu-') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: fork-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release and preserve existing images
        id: release
        run: bash scripts/fork-image.sh prepare
      - name: Build immutable release image
        if: steps.release.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/oliviacpu/wizarr:${{ github.ref_name }}
          build-args: APP_VERSION=2026.10.1
          labels: |
            org.opencontainers.image.source=https://github.com/oliviacpu/wizarr
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Move latest only for the newest release
        run: bash scripts/fork-image.sh latest
